name: Warm CI cache

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: warm-ci-cache-main
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '4'
  RUST_TEST_THREADS: '4'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  RAYON_NUM_THREADS: '1'
  TOKIO_WORKER_THREADS: '1'

jobs:
  warm-cache:
    name: Warm Rust cache (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust-${{ hashFiles('**/Cargo.lock') }}
          shared-key: hosted-${{ runner.arch }}
      - name: Cache embedded Postgres test dependency
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: postgres-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/store/tests/support/mod.rs', 'crates/store/tests/support/cache.rs') }}
          path: ~/.cache/tl3-test-postgres
      - name: Build targets and prepare test dependencies without running suites
        run: python3 tools/ci/rust_gate.py --prepare-only
      - name: Build deployment helper without running tests
        run: cargo build --locked -p tl3-controller --example tl3-deploy
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: matrix.runner == 'ubuntu-24.04'
        with:
          key: kani-0.68.0-${{ runner.os }}-${{ runner.arch }}
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
            ~/.rustup/toolchains/nightly-2026-08-21-*
      - name: Warm pinned Kani compiler without running proofs
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          if ! command -v cargo-kani >/dev/null; then
            cargo install --locked kani-verifier --version 0.68.0
          fi
          cargo kani setup
