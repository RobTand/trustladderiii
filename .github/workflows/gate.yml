name: Gate

# Bazel runs on BuildBuddy: the client on a Remote Bazel runner, every action on
# remote execution. This job keeps only what needs GitHub context. See
# docs/bazel.md. Rolling back means reverting the PR that added this file.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: '4'
  OMP_NUM_THREADS: '1'
  RAYON_NUM_THREADS: '1'
  TOKIO_WORKER_THREADS: '1'

jobs:
  bazel:
    name: Bazel
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    outputs:
      rust: ${{ steps.gate.outputs.rust }}
      python: ${{ steps.gate.outputs.python }}
      scopes_uploaded: ${{ steps.uploaded.outputs.scopes_uploaded }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: refs
        name: Queue-aware base and head
        uses: Mergifyio/gha-mergify-ci@392d123d84a27960993927aec1f2cbb059fb95c1 # v27
        with:
          action: scopes-git-refs
      - id: gate
        name: Select and test on BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          BRANCH: ${{ github.head_ref }}
        run: python3 tools/ci/remote_gate.py pr --base "$BASE" --head "$HEAD" --branch "$BRANCH"
      - id: token
        name: Require the Mergify token
        if: always() && steps.gate.outputs.scopes_ready == 'true'
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        # gha-mergify-ci skips scopes-upload and only warns when its token is empty.
        run: |
          if ! test -n "$MERGIFY_TOKEN"; then
            echo "::error::MERGIFY_TOKEN is empty; scopes cannot reach Mergify."
            exit 1
          fi
      - id: upload
        name: Upload scopes
        if: always() && steps.token.outcome == 'success'
        uses: Mergifyio/gha-mergify-ci@392d123d84a27960993927aec1f2cbb059fb95c1 # v27
        with:
          action: scopes-upload
          token: ${{ secrets.MERGIFY_TOKEN }}
          scopes: ${{ steps.gate.outputs.scopes }}
          all_scopes: ${{ steps.gate.outputs.all_scopes }}
      - id: uploaded
        if: always()
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          if [ "$OUTCOME" != success ]; then
            echo "::error::No scope list reached Mergify; the gate cannot pass."
            exit 1
          fi
          echo scopes_uploaded=true >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bazel-gate
          path: gate-output/
          retention-days: 7
          if-no-files-found: ignore

  rust-lint:
    name: Rust format and lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust-${{ hashFiles('**/Cargo.lock') }}
          shared-key: hosted-${{ runner.arch }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  feature-builds:
    name: Compile ${{ matrix.mode }}
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        mode: [features, kani]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust-${{ hashFiles('**/Cargo.lock') }}
          shared-key: hosted-${{ runner.arch }}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: matrix.mode == 'kani'
        with:
          key: kani-0.68.0-${{ runner.os }}-${{ runner.arch }}
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
            ~/.rustup/toolchains/nightly-2026-08-21-*
      - name: Install pinned Kani compiler
        if: matrix.mode == 'kani'
        run: |
          if ! command -v cargo-kani >/dev/null; then
            cargo install --locked kani-verifier --version 0.68.0
          fi
          cargo kani setup
      - name: Compile test and proof targets without running them
        run: python3 tools/ci/feature_gate.py '${{ matrix.mode }}'

  python-lint:
    name: Python lint and locks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.10.10'
      - name: Ruff and lockfiles of projects without tests
        run: python tools/ci/check.py python-lint
      - name: pip.parse requirements match uv.lock
        run: python tools/bazel/requirements.py --check

  rust:
    name: Rust
    needs: [bazel, rust-lint, feature-builds]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require Bazel's Rust verdict, scopes, lint and compiles
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci/remote_gate.py aggregate rust

  python:
    name: Python
    needs: [bazel, python-lint]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require Bazel's Python verdict, scopes and lint
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci/remote_gate.py aggregate python

  post-merge:
    name: Post-merge full run
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: prs
        name: Merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -o pipefail
          prs=$(git rev-list "$BEFORE..$AFTER" | while read -r sha; do
            gh api "repos/${GITHUB_REPOSITORY}/commits/$sha/pulls" --jq '.[].number'
          done | sort -nu | paste -sd, -)
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
      - name: Test everything on amd64 and arm64
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PRS: ${{ steps.prs.outputs.prs }}
        run: >-
          python3 tools/ci/remote_gate.py main --base "$BEFORE" --head "$AFTER"
          --branch main --prs "$PRS" --timeout 130
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: post-merge-${{ github.sha }}
          path: gate-output/
          retention-days: 90
          if-no-files-found: ignore
