[models]
# Rob, 2026-11-01: the worker ladder moved off gpt-6.1-sol, which was out of
# quota, to Anthropic models. This matches the live tl3.toml from 21:58Z.
# Families are labelled per model line, so Q22 still forces a different model to review.
# Budgets are per-response output limits and must not exceed limits.context_tokens.
# Claude: 1M context, 128K output. See deploy/dl380g10/README.md for sources and
# the proxy smoke command.
ingest = [{ name = "claude-sonnet-5-5", family = "claude-sonnet", effort = "high", budget_tokens = 32000 }]
audit = [{ name = "claude-sonnet-5-5", family = "claude-sonnet", effort = "high", budget_tokens = 32000 }]
planner = [
    { name = "claude-opus-5-5", family = "claude-opus", effort = "high", budget_tokens = 32000 },
    { name = "claude-fable-5-1", family = "claude-fable", effort = "high", budget_tokens = 32000 },
]
maker = [
    { name = "claude-sonnet-5-5", family = "claude-sonnet", effort = "high", budget_tokens = 32000 },
    { name = "claude-sonnet-5-5", family = "claude-sonnet", effort = "max", budget_tokens = 128000 },
    { name = "claude-opus-5-5", family = "claude-opus", effort = "high", budget_tokens = 128000 },
]
# The first reviewer from a different family is selected for each maker.
reviewer = [
    { name = "claude-opus-5-5", family = "claude-opus", effort = "high", budget_tokens = 32000 },
    { name = "claude-sonnet-5-5", family = "claude-sonnet", effort = "high", budget_tokens = 32000 },
]
# docs/state-table.md, "Rebasing": conflict repair runs an agent.
rebaser = [{ name = "claude-sonnet-5-5", family = "claude-sonnet", effort = "high", budget_tokens = 32000 }]
# Q15: an agent classifies Rob's issue comments.
comment_classifier = [{ name = "claude-sonnet-5-5", family = "claude-sonnet", effort = "high", budget_tokens = 8000 }]
writer = [{ name = "claude-sonnet-5-5", family = "claude-sonnet", effort = "high", budget_tokens = 8000 }]
