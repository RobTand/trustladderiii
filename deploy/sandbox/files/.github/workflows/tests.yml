name: Sandbox checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  tests:
    name: Sandbox tests
    runs-on: [self-hosted, linux, x64, tl3-sandbox-fleet]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.0'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 iniconfig==2.3.0 packaging==25.0 pluggy==1.6.0 pygments==2.19.2
      - name: Run sandbox tests
        run: python -m pytest -q
