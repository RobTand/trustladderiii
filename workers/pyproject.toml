[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "tl3-workers"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "deepagents==0.7.32",
    "langchain-openai==1.7.3",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "tiktoken==0.14.0",
    "tl3-harness",
]

[tool.uv.sources]
tl3-harness = { path = "../harness" }

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tl3_workers = ["schemas/*.json", "prompts/*.md", "evaluation/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
