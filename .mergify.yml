# Test batches on draft PRs, then move main to the exact tested head.
# Explicit queue commands follow coordinator review and PrismaBuild evidence.
# The Gate uploads each PR's impacted Bazel packages as its scopes.
scopes:
  source:
    manual:

merge_queue:
  mode: serial
  max_parallel_checks: 3
  reset_on_external_merge: always
  status_comments: outcomes
  queue_controls_comment: false

queue_rules:
  - name: default
    queue_conditions:
      - base = main
    branch_protection_injection_mode: merge
    merge_conditions:
      - check-success = Rust
      - check-success = Python
    merge_method: fast-forward
    batch_size: 8
    batch_max_wait_time: 4 minutes
    max_checks_retries: 0
    checks_timeout: 60 minutes
