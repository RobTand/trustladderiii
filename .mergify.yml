# Batch queued PRs, and check up to 3 batches at once, each on top of the ones
# ahead of it. Batches grow from 1 to 4 PRs as the queue backs up. A failed batch
# is split to find the culprit; with 3 checks, 4 PRs need one split round.
# Enqueue only by explicit command.
merge_queue:
  mode: serial
  max_parallel_checks: 3
  reset_on_external_merge: always
  status_comments: outcomes
  queue_controls_comment: false

queue_rules:
  - name: default
    queue_conditions:
      - base = main
      - check-success = Rust
      - check-success = Python
    merge_conditions:
      - check-success = Rust
      - check-success = Python
    merge_method: merge
    batch_size:
      min: 1
      max: 4
    max_checks_retries: 0
    checks_timeout: 60 minutes
