[package]
name = "tl3-mergify"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tl3-github = { path = "../github" }

[dev-dependencies]
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
