[package]
name = "tl3-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tl3-prismabuild = { path = "../prismabuild" }
tokio = { version = "1", features = ["rt", "time", "net", "process", "sync", "macros"] }
tl3-kernel = { path = "../kernel", features = ["serde"] }
tl3-store = { path = "../store" }
tl3-config = { path = "../config" }

[dev-dependencies]
tl3-worktrees = { path = "../worktrees" }
postgres = "0.19"
postgresql_embedded = { version = "0.22", default-features = false, features = ["tokio", "zonky", "tls-rustls-ring"] }
tempfile = "3"

[[test]]
name = "simulation"
path = "tests/simulation.rs"
harness = false

[[test]]
name = "prismabuild"
path = "tests/prismabuild.rs"
harness = false
