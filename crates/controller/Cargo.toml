[package]
name = "tl3-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
libc = "0.2"
loom = { version = "0.7", optional = true }
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
jsonschema = { version = "0.46", default-features = false }
rustix = { version = "1", features = ["process", "event", "fs", "stdio"] }
thiserror = "2"
sha2 = "0.10"
regex = "1"
regex-syntax = "0.8"
fancy-regex = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "process", "sync", "macros"] }
tl3-kernel = { path = "../kernel", features = ["serde"] }
tl3-harness-core = { path = "../harness-core" }
tl3-store = { path = "../store" }
tl3-config = { path = "../config" }
tl3-contracts = { path = "../contracts" }
tl3-controller-core = { path = "../controller-core" }
tl3-delivery = { path = "../delivery" }
tl3-github = { path = "../github" }
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
schemars = "1"

tl3-worktrees = { path = "../worktrees" }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
loom = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
wiremock = "0.6"
postgres = "0.19"
postgresql_embedded = { version = "0.22", default-features = false, features = ["tokio", "zonky", "tls-rustls-ring"] }
tempfile = "3"
hmac = "0.12"
hex = "0.4"

[features]
# Example-only: fx-stage-packet stages canary packets before an activation pin exists
# (FX-REQUAL-43 OQ-1). Never default; no deployed binary or workspace crate enables it.
# tests/activation_qualification_absent.rs and deploy/dl380g10/build-release.sh enforce this.
activation-qualification = []

[[example]]
name = "fx-stage-packet"
path = "examples/fx-stage-packet.rs"
required-features = ["activation-qualification"]

[[example]]
name = "generate-fx-qualification"
path = "tools/generate_fx_qualification.rs"

[[example]]
name = "tl3-deploy"
path = "../../deploy/dl380g10/helper.rs"

[[test]]
name = "simulation"
path = "tests/simulation.rs"
harness = false


[[test]]
name = "worktrees"
path = "tests/worktrees.rs"
harness = false

[[test]]
name = "github"
path = "tests/github.rs"
harness = false

[[test]]
name = "crash_safety"
path = "tests/crash_safety.rs"
harness = false

[[test]]
name = "workers"
path = "tests/workers.rs"
harness = false

[[test]]
name = "looks"
path = "tests/looks.rs"
harness = false

[[test]]
name = "publishing"
path = "tests/publishing.rs"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(verus_keep_ghost)"] }
