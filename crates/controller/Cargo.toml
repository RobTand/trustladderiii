[package]
name = "tl3-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tl3-kernel = { path = "../kernel", features = ["serde"] }
tl3-store = { path = "../store" }
tl3-config = { path = "../config" }

[dev-dependencies]
postgresql_embedded = { version = "0.22", default-features = false, features = ["tokio", "zonky", "tls-rustls-ring"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "net"] }

[[test]]
name = "simulation"
path = "tests/simulation.rs"
harness = false
