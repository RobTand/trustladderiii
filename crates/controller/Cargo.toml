[package]
name = "tl3-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.46", default-features = false }
rustix = { version = "1", features = ["process", "event", "fs"] }
thiserror = "2"
tl3-kernel = { path = "../kernel", features = ["serde"] }
tl3-store = { path = "../store" }
tl3-config = { path = "../config" }
tl3-github = { path = "../github" }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "net"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

tl3-worktrees = { path = "../worktrees" }
postgres = "0.19"
postgresql_embedded = { version = "0.22", default-features = false, features = ["tokio", "zonky", "tls-rustls-ring"] }
tempfile = "3"
wiremock = "0.6"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
hmac = "0.12"
hex = "0.4"

[[test]]
name = "simulation"
path = "tests/simulation.rs"
harness = false

[[test]]
name = "github"
path = "tests/github.rs"
harness = false

[[test]]
name = "workers"
path = "tests/workers.rs"
harness = false
