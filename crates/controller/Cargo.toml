[package]
name = "tl3-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
loom = "0.7"
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.46", default-features = false }
rustix = { version = "1", features = ["process", "event", "fs"] }
thiserror = "2"
sha2 = "0.10"
tl3-prismabuild = { path = "../prismabuild" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "process", "sync", "macros"] }
tl3-kernel = { path = "../kernel", features = ["serde"] }
tl3-store = { path = "../store" }
tl3-config = { path = "../config" }
tl3-github = { path = "../github" }
tl3-mergify = { path = "../mergify" }
chrono = { version = "0.4", features = ["serde"] }

tl3-worktrees = { path = "../worktrees" }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
wiremock = "0.6"
postgres = "0.19"
postgresql_embedded = { version = "0.22", default-features = false, features = ["tokio", "zonky", "tls-rustls-ring"] }
tempfile = "3"
hmac = "0.12"
hex = "0.4"

[[example]]
name = "tl3-deploy"
path = "../../deploy/dl380g10/helper.rs"

[[test]]
name = "simulation"
path = "tests/simulation.rs"
harness = false

[[test]]
name = "prismabuild"
path = "tests/prismabuild.rs"
harness = false


[[test]]
name = "worktrees"
path = "tests/worktrees.rs"
harness = false

[[test]]
name = "github"
path = "tests/github.rs"
harness = false

[[test]]
name = "crash_safety"
path = "tests/crash_safety.rs"
harness = false

[[test]]
name = "mergify"
path = "tests/mergify.rs"
harness = false

[[test]]
name = "workers"
path = "tests/workers.rs"
harness = false

[[test]]
name = "looks"
path = "tests/looks.rs"
harness = false
