[package]
name = "tl3-console"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tl3-config = { path = "../config" }
tl3-controller = { path = "../controller" }
tl3-store = { path = "../store" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[dev-dependencies]
postgres = "0.19"
postgresql_embedded = { version = "0.22", default-features = false, features = ["tokio", "zonky", "tls-rustls-ring"] }
rustix = { version = "1", features = ["process"] }
serde_json = "1"
tempfile = "3"
tl3-kernel = { path = "../kernel" }
tokio = { version = "1", features = ["rt", "time", "net"] }

[[test]]
name = "console"
path = "tests/console.rs"
harness = false
