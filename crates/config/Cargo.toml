[package]
name = "tl3-config"
version = "0.1.0"
edition = "2024"

[dependencies]
tl3-worktrees = { path = "../worktrees" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
url = { version = "2", features = ["serde"] }
glob = "0.3"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
